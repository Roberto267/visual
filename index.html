<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Para ti, mi denis linda! ❤️✨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(rgba(9, 5, 20, 0.8), rgba(9, 5, 20, 0.8)), 
                        url('https://images.unsplash.com/photo-1506318137071-a8e063b4bec0?q=80&w=1000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            overflow: hidden;
            text-align: center;
            padding: 20px;
            position: relative;
        }

        .card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            max-width: 480px;
            width: 100%;
            animation: fadeIn 1.2s ease-out;
        }

        .icon-dev {
            font-size: 3rem;
            margin-bottom: 15px;
            display: inline-block;
            filter: drop-shadow(0 0 10px #ff4b91);
            animation: float 3s ease-in-out infinite;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #38bdf8;
            text-shadow: 0 2px 10px rgba(56, 189, 248, 0.3);
            line-height: 1.4;
        }

        p {
            font-size: 1.25rem;
            color: #f1f5f9;
            margin-bottom: 35px;
            line-height: 1.6;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .btn {
            display: inline-block;
            padding: 14px 40px;
            background: linear-gradient(135deg, #ff4b91, #3b82f6);
            color: white;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.2rem;
            border-radius: 50px;
            box-shadow: 0 4px 20px rgba(255, 75, 145, 0.5);
            transition: all 0.3s ease;
            animation: pulse 2s infinite;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 75, 145, 0.9);
            animation: none;
        }

        .btn:active {
            transform: scale(0.98);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 75, 145, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 75, 145, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 75, 145, 0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-dev">💖💞</div>
        <h1>¡Hola mi querida denis linda! 🥰❤️<br>Te quiero decir algo... 💖</h1>
        <p>Eres una gran chica y mereces lo mejor, intentaré ser lo mejor para ti ya que lo mereces mucho... 💕<br>Presiona el botón para leer más 😉💓</p>
        <a href="sorpresa.html" class="btn">Presiona aquí ❤️</a>
    </div>

</body>
</html>
